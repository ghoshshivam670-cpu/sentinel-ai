name: SentinelAI CI & Sandbox Benchmarks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-suite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sandbox & Evaluation Unit Tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest tests/test_evals.py -v

  docker-build-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          docker compose config -q

      - name: Build Production Docker Image
        run: |
          docker build -t sentinel-ai:ci .

      - name: Run Tests Inside Hardened Non-Root Container
        run: |
          docker run --rm sentinel-ai:ci python -m pytest tests/test_evals.py -v
