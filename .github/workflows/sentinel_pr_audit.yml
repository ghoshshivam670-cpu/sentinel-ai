name: SentinelAI Autonomous PR Review Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  sentinel-pr-audit:
    runs-on: ubuntu-latest
    env:
      DEFAULT_LLM_PROVIDER: gemini
      MODEL_NAME: gemini-3.5-flash-lite
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout PR Head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Detect Modified Python Files
        id: changed-files
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          FILES=$(git diff --name-only --diff-filter=AM origin/${{ github.base_ref }}...HEAD -- '*.py' | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Modified Python files: $FILES"

      - name: Run SentinelAI Multi-Agent Audit
        if: steps.changed-files.outputs.files != '' && env.GEMINI_API_KEY != ''
        run: |
          python scripts/pr_audit.py ${{ steps.changed-files.outputs.files }} --output pr_comment.md --max-iterations 3

      - name: Fallback Notice if API Key Not Configured
        if: steps.changed-files.outputs.files != '' && env.GEMINI_API_KEY == ''
        run: |
          python -c "from pathlib import Path; Path('pr_comment.md').write_text('## 🛡️ SentinelAI Autonomous PR Review\n\n⚠️ `GEMINI_API_KEY` secret is not configured in repository settings (`Settings > Secrets and variables > Actions`).\nAdd `GEMINI_API_KEY` to enable automated multi-agent security audits & self-healing patches on Pull Requests.\n', encoding='utf-8')"

      - name: Post SentinelAI Review Comment on PR
        if: always() && hashFiles('pr_comment.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pr_comment.md', 'utf8');
            const marker = '## 🛡️ SentinelAI Autonomous PR';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
